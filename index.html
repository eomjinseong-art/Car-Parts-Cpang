  <script>
    const CATEGORIES = ['세차·클리닝', '정비·소모품', '실내·편의', '전자·충전', '안전', '기타'];
    const PLACEHOLDER = './images/placeholder.svg';
    const PAGE_SIZE = 30;
    const ORDER_KEY = 'charangmall-product-order';
    const state = { products: [], category: '전체', page: 1 };
    const $ = id => document.getElementById(id);
    function applySiteLinks(config) {
      $('heroTitle').textContent = config.hero.title;
      $('heroDescription').textContent = config.hero.description;
      $('headerLink').href = config.featuredLink;
      $('headerLink').textContent = config.featuredLabel;
      if (config.rocketWowLink) $('footerWow').href = config.rocketWowLink;
      if (config.carSearchLink) $('footerStay').href = config.carSearchLink;
      if (config.archiveLink && $('footerArchive')) $('footerArchive').href = config.archiveLink;
      if (config.blogLink && $('headerBlog')) $('headerBlog').href = config.blogLink;
      if (config.blogLink && $('footerBlog')) $('footerBlog').href = config.blogLink;
      if (config.blogLabel && $('headerBlog')) $('headerBlog').textContent = config.blogLabel;
      if (config.blogLabel && $('footerBlog')) $('footerBlog').textContent = config.blogLabel;
    }
    fetch('./data/config.json').then(response => response.json()).then(applySiteLinks);
    fetch('./data/products.json').then(response => {
      if (!response.ok) throw new Error('상품 데이터 응답 오류');
      return response.json();
    }).then(products => {
      state.products = applySessionOrder(uniqueProducts(products).filter(item =>
        item.product?.imageUrl?.endsWith('.jpg') && !/^자동차 용품 추천/.test(item.product.title || '')
      ));
      renderCategories();
      renderProducts();
    }).catch(error => {
      $('status').textContent = '상품을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
      console.error(error);
    });
    function uniqueProducts(list) {
      const seen = new Set();
      return list.filter(item => {
        const title = item.product?.title || '';
        const key = item.product?.productId
          || (!/^자동차 용품 추천 /.test(title) && title)
          || item.product?.coupangUrl;
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }
    function shuffleIds(ids) {
      const items = ids.slice();
      for (let i = items.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }
    function readSavedOrder() {
      try {
        const saved = JSON.parse(sessionStorage.getItem(ORDER_KEY) || 'null');
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }
    function writeSavedOrder(ids) {
      try { sessionStorage.setItem(ORDER_KEY, JSON.stringify(ids)); } catch {}
    }
    function sortByOrder(products, ids) {
      const rank = new Map(ids.map((id, index) => [id, index]));
      return products.slice().sort((a, b) => (rank.get(a.id) ?? 0) - (rank.get(b.id) ?? 0));
    }
    function applySessionOrder(products) {
      const currentIds = products.map(item => item.id);
      const known = new Set(currentIds);
      const kept = readSavedOrder().filter(id => known.has(id));
      const keptSet = new Set(kept);
      const newcomers = shuffleIds(currentIds.filter(id => !keptSet.has(id)));
      const order = kept.length ? kept.concat(newcomers) : shuffleIds(currentIds);
      writeSavedOrder(order);
      return sortByOrder(products, order);
    }
    function reshuffleSessionOrder() {
      const order = shuffleIds(state.products.map(item => item.id));
      writeSavedOrder(order);
      state.products = sortByOrder(state.products, order);
    }
    function buttonClass(category) {
      return `shrink-0 px-1 py-2 text-[12px] font-medium tracking-wide ${category === state.category ? 'border-b-2 border-black text-black' : 'text-neutral-400 hover:text-black'}`;
    }
    function renderCategories() {
      $('categoryAll').className = buttonClass('전체');
      const used = new Set(state.products.map(item => item.category));
      const visible = CATEGORIES.filter(category => used.has(category));
      $('categoryScroll').innerHTML = visible.map(category =>
        `<button type="button" data-category="${escapeHtml(category)}" class="${buttonClass(category)}">${escapeHtml(category)}</button>`
      ).join('');
      $('categoryAll').onclick = () => selectCategory('전체');
      $('categoryScroll').querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => selectCategory(button.dataset.category));
      });
    }
    function selectCategory(category) {
      const resettingFilters = category === '전체' && state.category !== '전체';
      state.category = category;
      state.page = 1;
      if (resettingFilters) reshuffleSessionOrder();
      renderCategories();
      renderProducts();
      $('productGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function visibleProducts() {
      return state.category === '전체'
        ? state.products
        : state.products.filter(item => item.category === state.category);
    }
    function pageButtonClass(active, disabled) {
      const base = 'min-h-11 min-w-11 shrink-0 px-3 text-[12px] font-medium tracking-wide';
      if (disabled) return `${base} text-neutral-300`;
      if (active) return `${base} bg-black text-white`;
      return `${base} text-neutral-500 hover:text-black`;
    }
    function goToPage(page, totalPages) {
      const next = Math.min(totalPages, Math.max(1, page));
      if (next === state.page) return;
      state.page = next;
      renderProducts();
      $('productGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function renderPagination(total) {
      const nav = $('pagination');
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (state.page > totalPages) state.page = totalPages;
      if (total === 0 || totalPages <= 1) {
        nav.classList.add('hidden');
        nav.innerHTML = '';
        return;
      }
      const start = (state.page - 1) * PAGE_SIZE + 1;
      const end = Math.min(state.page * PAGE_SIZE, total);
      const prevDisabled = state.page === 1;
      const nextDisabled = state.page === totalPages;
      const pages = Array.from({ length: totalPages }, (_, index) => index + 1);
      nav.classList.remove('hidden');
      nav.innerHTML = `
        <p class="mb-3 text-center text-[11px] leading-5 text-neutral-400">${start}–${end} / ${total}개 · ${state.page} / ${totalPages}페이지</p>
        <div class="flex flex-wrap items-center justify-center gap-1 sm:gap-2">
          <button type="button" data-page="prev" ${prevDisabled ? 'disabled' : ''} aria-label="이전 페이지" class="${pageButtonClass(false, prevDisabled)}">이전</button>
          ${pages.map(page => `<button type="button" data-page="${page}" aria-label="${page}페이지" ${page === state.page ? 'aria-current="page"' : ''} class="${pageButtonClass(page === state.page, false)}">${page}</button>`).join('')}
          <button type="button" data-page="next" ${nextDisabled ? 'disabled' : ''} aria-label="다음 페이지" class="${pageButtonClass(false, nextDisabled)}">다음</button>
        </div>
      `;
      nav.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          const target = button.dataset.page;
          if (target === 'prev') goToPage(state.page - 1, totalPages);
          else if (target === 'next') goToPage(state.page + 1, totalPages);
          else goToPage(Number(target), totalPages);
        });
      });
    }
    function formatPrice(value) {
      const n = Number(value);
      return Number.isFinite(n) && n > 0 ? n.toLocaleString('ko-KR') + '원' : '';
    }
    function cardMeta(item) {
      const price = formatPrice(item.product?.price);
      const rocket = item.product?.rocket
        ? '<span class="text-[10px] font-medium tracking-wide text-blue-600">로켓배송</span>'
        : '';
      if (!price && !rocket) return '';
      return `<div class="mt-1 flex items-center gap-1.5">${rocket}${price ? `<span class="text-[12px] font-semibold leading-4">${price}</span>` : ''}</div>`;
    }
    function renderProducts() {
      const products = visibleProducts();
      const totalPages = Math.max(1, Math.ceil(products.length / PAGE_SIZE));
      if (state.page > totalPages) state.page = totalPages;
      if (state.page < 1) state.page = 1;
      const start = (state.page - 1) * PAGE_SIZE;
      const pageItems = products.slice(start, start + PAGE_SIZE);
      $('status').classList.toggle('hidden', products.length > 0);
      $('productGrid').classList.toggle('hidden', products.length === 0);
      $('status').textContent = products.length
        ? ''
        : state.category === '전체'
          ? '표시할 상품이 없습니다.'
          : `${state.category} 상품이 없습니다.`;
      $('productGrid').innerHTML = pageItems.map(item => `<a href="${escapeHtml(item.product.coupangUrl)}" target="_blank" rel="noopener sponsored" class="group text-left"><div class="overflow-hidden bg-neutral-50"><img src="${escapeHtml(item.product.imageUrl)}" alt="${escapeHtml(item.product.title)}" class="aspect-square w-full object-cover transition duration-200 group-hover:scale-[1.03]" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER}'"></div><div class="pt-2"><span class="text-[10px] font-medium tracking-wide text-neutral-400">${escapeHtml(item.category || '추천')}</span><h2 class="mt-1 line-clamp-2 text-[12px] font-medium leading-5">${escapeHtml(item.product.title)}</h2>${cardMeta(item)}<p class="mt-1 line-clamp-2 text-[11px] leading-4 text-neutral-500">${escapeHtml(item.description || item.product.description || '자동차를 위한 추천 용품')}</p></div></a>`).join('');
      renderPagination(products.length);
    }
    function openModal(item) {
      $('modalCategory').textContent = item.category || '추천';
      $('modalImage').onerror = function () { this.onerror = null; this.src = PLACEHOLDER; };
      $('modalImage').src = item.product.imageUrl;
      $('modalImage').alt = item.product.title;
      $('modalTitle').textContent = item.product.title;
      const price = formatPrice(item.product?.price);
      $('modalPrice').textContent = price;
      $('modalPrice').classList.toggle('hidden', !price);
      $('modalDescription').textContent = item.description || item.product.description || '자동차를 위한 추천 용품입니다.';
      $('modalLink').href = item.product.coupangUrl;
      $('modal').classList.replace('hidden', 'flex');
    }
    function closeModal() { $('modal').classList.replace('flex', 'hidden'); }
    $('closeModal').addEventListener('click', closeModal);
    $('modal').addEventListener('click', event => { if (event.target === $('modal')) closeModal(); });
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])); }
  </script>
